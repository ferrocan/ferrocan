[package]
name = "nucleo-g431kb"
description = "Bench tests of can-hal-mcan on ST's NUCLEO-G431KB, in internal loopback"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# Bare metal: there is no test harness on the target.
[[bin]]
name = "loopback"
test = false
bench = false

[dependencies]
can-hal = { version = "0.4.3", path = "../../can-hal-rs/can-hal", package = "can-hal-rs", default-features = false }
can-hal-mcan = { path = "../can-hal-mcan", features = ["defmt"] }
embassy-stm32 = { version = "0.6.0", features = ["stm32g431kb", "defmt", "memory-x", "time-driver-tim2", "unstable-pac"] }
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime", "tick-hz-1_000_000"] }
cortex-m = { version = "0.7.10", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.7"
defmt = "1.2.0"
defmt-rtt = "1.3.1"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }

[lints]
workspace = true
