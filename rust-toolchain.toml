# One exact toolchain, so that CI and local builds make the same images.
[toolchain]
channel = "1.99.0"
profile = "minimal"
components = ["rustfmt", "clippy", "llvm-tools"]
targets = ["thumbv6m-none-eabi", "thumbv7em-none-eabihf"]
