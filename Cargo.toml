[workspace]
resolver = "3"
members = ["firmware"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ferrocan/ferrocan"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

[profile.dev]
# Symbols don't take flash space.
debug = true
opt-level = "s"

[profile.release]
debug = true
opt-level = "s"
lto = "fat"
codegen-units = 1
