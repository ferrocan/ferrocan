# cargo-about: the third-party notices shipped with each release image
# (scripts/release.sh). The licences accepted match deny.toml.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "Unlicense",
]
targets = ["thumbv6m-none-eabi", "thumbv7em-none-eabihf"]
# Only what is linked into the image needs its notice.
ignore-build-dependencies = true
ignore-dev-dependencies = true
